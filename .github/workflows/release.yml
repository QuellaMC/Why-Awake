name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Build and publish GitHub release
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "Why Awake.xcodeproj" \
            -scheme "Why Awake" \
            -destination "platform=macOS" \
            -derivedDataPath "${RUNNER_TEMP}/whyawake-test-dd" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:"Why AwakeTests"

      - name: Package unsigned app
        id: package
        env:
          DERIVED_DATA: ${{ runner.temp }}/whyawake-release-dd
          OUTPUT_DIR: ${{ runner.temp }}/whyawake-release
          VERSION: ${{ github.ref_name }}
        run: |
          package_output="$(./script/package_release.sh)"
          echo "${package_output}"
          zip_path="$(printf '%s\n' "${package_output}" | sed -n '1p')"
          dmg_path="$(printf '%s\n' "${package_output}" | sed -n '2p')"
          {
            echo "zip_path=${zip_path}"
            echo "dmg_path=${dmg_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Why-Awake-${{ github.ref_name }}-macOS-artifacts
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.dmg_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_notes="Automated unsigned build from ${GITHUB_SHA}."

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ZIP_PATH}" "${DMG_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${ZIP_PATH}" "${DMG_PATH}" \
              --title "Why Awake ${TAG_NAME}" \
              --notes "${release_notes}"
          fi
